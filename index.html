<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blinkit Darkstore QR Manager</title>
  <link rel="stylesheet" href="styles.css">
  <!-- PWA Manifest Link -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f7c325">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
   <!-- Register Service Worker -->
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
</head>
<body>

  <!-- Sticky Top Navigation -->
  <header class="sticky-nav">
    <div class="nav-title">Blinkit Darkstore</div>
    <div class="nav-buttons">
      <button class="nav-btn active" data-type="AISLE">Aisle</button>
      <button class="nav-btn" data-type="FNV">FNV</button>
      <button class="nav-btn" data-type="CR">CR</button>
      <button class="nav-btn" data-type="FR">FR</button>
    </div>
  </header>

  <main class="container">
    <!-- Breadcrumb Path -->
    <div id="breadcrumb" class="breadcrumb">Select a storage zone above</div>

    <!-- Dynamic Drill-down Content -->
    <div id="selectionGrid" class="button-grid"></div>

    <!-- Final QR Code Output Display -->
    <div id="qrDisplay" class="qr-display hidden">
      <div class="qr-header">
        <h2 id="qrTitle"></h2>
        <button onclick="window.print()" class="print-btn">Print Shelf QRs</button>
      </div>
      <div id="qrGrid" class="qr-grid"></div>
    </div>
  </main>

  <!-- QR Code Lightbox Popup Overlay -->
<div id="qrModal" class="modal hidden">
  <div class="modal-content qr-modal-content">
    <button id="closeQrModalBtn" class="close-btn">&times;</button>
    <div id="modalQrCard" class="qr-card modal-qr-card">
      <p id="modalQrLabel"></p>
      <div id="modalQrCode"></div>
    </div>
  </div>
</div>

  <script src="script.js"></script>
 
</body>
</html>
